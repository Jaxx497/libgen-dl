name: Android APK

on:
  workflow_dispatch:
  workflow_call: # the release workflow builds the APK through this
    inputs:
      ref:
        type: string
        default: ""

permissions:
  contents: write # manual runs publish a prerelease (below)

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4 # the Capacitor CLI needs Node 22+
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The runner image ships the SDK; Gradle fetches the platform it needs once licenses are accepted.
      - run: yes | "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager --licenses > /dev/null
      - run: npm ci
      - run: npm run web
      # The android/ project is generated, not committed.
      - run: npx cap add android && npx cap sync android
      # Our icons and splash replace Capacitor's defaults (made by scripts/make-icons.py).
      - run: cp -r resources/android-res/. android/app/src/main/res/
      # Every build is signed with the one release key, so each installs over the last.
      # The keystore is kept outside the repo.
      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE secret is missing"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=libgen-dl \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"
      # The storage plugin's manifest must have merged in (Android 9 and older publish to Downloads with it).
      - run: grep -rl WRITE_EXTERNAL_STORAGE android/app/build/intermediates/merged_manifests
      # Unsigned output would be app-release-unsigned.apk, so this also fails if signing didn't happen.
      - run: cp android/app/build/outputs/apk/release/app-release.apk LibgenDL.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LibgenDL.apk
          path: LibgenDL.apk
      # Manual runs publish a rolling prerelease so Obtainium (with "include prereleases") can track it.
      # github.workflow is the caller's name, so the release workflow's own APK build skips this.
      - name: Publish dev prerelease
        if: github.workflow == 'Android APK'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="dev-${{ github.run_number }}"
          gh release list --json tagName -q '.[].tagName | select(startswith("dev-"))' \
            | xargs -r -n1 gh release delete --cleanup-tag --yes
          gh release create "$tag" LibgenDL.apk --prerelease --target "$GITHUB_SHA" \
            --title "Dev build ${{ github.run_number }}" --notes "Unreleased build of ${GITHUB_SHA::7}."
